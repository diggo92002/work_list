<!doctype html>
<html lang="zh-TW">

  <style>

    table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0 8px; background: transparent; } th, td { padding: 9px 10px; vertical-align: middle; } th { padding: 0 10px 5px; border: 0; color: #64748b; font-size: 13px; font-weight: 700; text-align: left; } th:nth-child(n+2) { text-align: center; } #list tr { filter: drop-shadow(0 1px 1px #0000000d); } #list td { border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; background: #fff; } #list td:first-child { border-left: 1px solid #e2e8f0; border-radius: 9px 0 0 9px; } #list td:last-child { border-right: 1px solid #e2e8f0; border-radius: 0 9px 9px 0; } #list input:not([type="color"]) { border-color: transparent; background: transparent; } #list input:not([type="color"]):focus { border-color: #60a5fa; background: #fff; outline: 2px solid #dbeafe; } #list td:first-child input { font-weight: 700; color: #111827; } #list td:nth-child(2) input { color: #64748b; font-size: 14px; } td input, td select { width: 100%; }
    .link { color: #2563eb; text-decoration: none; border: 0; padding: 4px; min-height: auto; background: transparent; }.link:hover { text-decoration: underline; }.color { width: 30px; height: 30px; padding: 2px; }.actions-cell { white-space: nowrap; }.status-select { border: 0; border-radius: 99px; font-weight: 700; text-align: center; }.status-select[value="未開始"] { background: #e5e7eb; color: #374151; }.status-select[value="進行中"] { background: #dbeafe; color: #1d4ed8; }.status-select[value="等待中"] { background: #fef3c7; color: #92400e; }.status-select[value="已完成"] { background: #dcfce7; color: #15803d; }.empty { padding: 28px; text-align: center; background: #fff; border-radius: 8px; color: #6b7280; }.hidden { display: none !important; }
    #list textarea { display: block; width: 100%; min-height: 24px; padding: 0; overflow: hidden; resize: none; border-color: transparent; background: transparent; line-height: 1.45; font-family: inherit; font-size: inherit; } #list textarea:focus { border-color: #60a5fa; background: #fff; outline: 2px solid #dbeafe; } #list td:first-child textarea { font-weight: 700; color: #111827; } #list td:nth-child(2) textarea { color: #64748b; font-size: 14px; }
    body.links-hidden #taskLink, body.links-hidden #table th:nth-child(4), body.links-hidden #list td:nth-child(4) { display: none; }
    .dialog-mask { position: fixed; inset: 0; z-index: 10; display: none; padding: 10px; background: #0008; align-items: center; justify-content: center; }.dialog-mask.show { display: flex; }.dialog { width: min(480px, 100%); max-height: calc(100dvh - 20px); padding: 14px; overflow-y: auto; border-radius: 10px; background: #fff; }.dialog h2 { margin: 0 0 8px; font-size: 20px; }.dialog p { margin: 0 0 12px; color: #4b5563; line-height: 1.5; }textarea { display: block; width: 100%; min-height: 240px; padding: 10px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }#syncText { min-height: 160px; max-height: 45dvh; }.dialog .actions { justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }.import-option { display: flex; gap: 6px; align-items: center; margin: 10px 0; }
    @media (max-width: 760px) { body { padding: 8px; }.tools, .toolbar { width: 100%; }.tools button, .toolbar button { flex: 1; }.toolbar { flex-wrap: wrap; }.toolbar .spacer { display: none; }.form { grid-template-columns: 1fr; }table, thead, tbody, tr, td { display: block; width: 100%; } thead { display: none; } tr { margin-bottom: 10px; border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; } td { display: grid; grid-template-columns: 72px 1fr; gap: 8px; border: 0; border-bottom: 1px solid #e5e7eb; } td:last-child { border-bottom: 0; } td::before { content: attr(data-label); color: #4b5563; font-weight: bold; } td.actions-cell { display: flex; justify-content: flex-end; } td.actions-cell::before { display: none; } }
  </style>
  <style>
    @media (max-width: 760px) {
      #list tr { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); margin-bottom: 8px; border: 1px solid #d1d5db; border-radius: 9px; overflow: hidden; background: #fff; }

    <style>
      /* 每列的底色覆蓋儲存格原本的白色背景，確保選色會立即顯示。 */
      #list tr td { background: var(--task-color, #fff) !important; }
      .actions-cell { display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
      .actions-cell .color, .actions-cell .danger { flex: 1 1 0; width: 0; min-width: 0; height: 32px; padding: 4px; }
      .actions-cell .danger { color: #b91c1c; border: 1px solid #fecaca; border-radius: 6px; background: #fef2f2; }
      .task-color { border-color: #9ca3af; }
      .color-picker { position: relative; flex: 1 1 0; min-width: 0; }
      .color-picker .color { width: 100%; }
      .color-palette { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 2; display: none; grid-template-columns: repeat(5, 28px); gap: 5px; padding: 6px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; box-shadow: 0 4px 12px #0002; }
      .color-picker.show .color-palette { display: grid; }
      #list tr.palette-open { overflow: visible; }
      .color-swatch { width: 28px; height: 28px; min-height: 0; padding: 0; border: 1px solid #94a3b8; border-radius: 5px; }
      @media (min-width: 761px) {
        /* 保持操作欄為真正的 table-cell，才能和同列的狀態、日期垂直置中。 */

        .actions-cell .color-picker, .actions-cell .danger { display: inline-block; width: calc(50% - 4px); vertical-align: middle; }
        .actions-cell .color { width: 100%; }
      }
      @media (max-width: 760px) { .actions-cell .color, .actions-cell .danger { height: 30px; } }
    </style>
    <style>
      /* iOS 會在聚焦小於 16px 的欄位時自動放大頁面。 */
      @media (max-width: 760px) {
        #syncText { font-size: 16px; }
        .dialog-mask { padding: 10px; align-items: center; overflow-y: auto; }
        .dialog { margin: 0; }

    </style>
    <style>
      #addForm > * { min-width: 0; width: 100%; }
      @media (min-width: 761px) { .form { grid-template-columns: 45px minmax(0, 1.35fr) minmax(0, 1.1fr) minmax(0, 1.15fr) 60px 145px auto; } }
      #list .status-select { min-height: 28px; padding: 3px 2px; font-size: 13px; }
      #list td.actions-cell { padding-left: 3px; padding-right: 3px; gap: 3px; }
      #list .actions-cell .color-picker, #list .actions-cell .danger { flex: 0 0 26px; width: 26px; }
      #list .actions-cell .color, #list .actions-cell .danger { width: 26px; height: 19px; min-height: 19px; padding: 0; font-size: 12px; border-radius: 3px; }
      #list td:nth-child(2) textarea { font-weight: 700; color: #111827; font-size: inherit; }

      @media (max-width: 760px) {
        #list td:nth-child(1) { grid-column: span 2; }
        #list td:nth-child(2) { grid-column: span 8; }
        #list td:nth-child(3), #list td:nth-child(4) { grid-column: 1 / -1; }
        #list td:nth-child(5) { grid-column: span 3; border-left: 0; }
        #list td:nth-child(6) { grid-column: span 5; }
        #list td:nth-child(7) { grid-column: span 2; border-left: 1px solid #e5e7eb; }
        #list td:last-child { flex-wrap: wrap; }
      }
    </style>
    <style>
      #list td:first-child { padding-left: 4px; padding-right: 4px; }
      #list td:nth-child(5) { padding-left: 2px; padding-right: 2px; }
      #list .status-select { font-size: 12px; padding-left: 0; padding-right: 0; }
      #list .actions-cell .color-picker { flex: 0 0 13px; width: 13px; }
      #list .actions-cell .color { width: 13px; height: 10px; min-height: 10px; }
      @media (max-width: 760px) {
        #list td:nth-child(1) { grid-column: span 1; }
        #list td:nth-child(2) { grid-column: span 9; }
        #list td:nth-child(5) { grid-column: span 2; }
        #list td:nth-child(6) { grid-column: span 6; }
      }
    </style>
    <style>
      #categorySortButton { min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent; color: inherit; font: inherit; white-space: normal; }
      #categorySortButton:focus-visible { outline: 2px solid #60a5fa; }
      #categoryFilter, #categorySort { min-width: 0; width: 96px; max-width: 120px; padding-left: 5px; padding-right: 5px; }
      .toolbar { flex-wrap: wrap; }
    </style>
    <style>
      .view-controls, .category-controls { display: flex; align-items: center; gap: 8px; }
      .category-controls { flex-shrink: 0; }
      .category-controls label, .tools button, .toolbar button { white-space: nowrap; }
      @media (max-width: 760px) {
        .view-controls { width: 100%; flex-wrap: wrap; }
        .category-controls { width: 100%; }
        .toolbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; }
        .toolbar .spacer { display: block; }
        .toolbar button { padding-left: 8px; padding-right: 8px; }
      }
    </style>
    <style>
      .tools button { min-width: 0; padding-left: 5px; padding-right: 5px; }
      @media (max-width: 760px) {
        .view-controls .tools { width: calc(50% - 4px); }
      }
    </style>
    <style>
      @media (max-width: 760px) {
        .view-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
        .view-controls .category-controls { display: grid; grid-template-columns: auto auto; justify-content: start; width: auto; min-width: 0; gap: 6px; }
        .category-controls #categoryFilter, .category-controls #categorySort { width: 100%; max-width: 96px; }
        .view-controls .tools { width: auto; gap: 6px; }
        .view-controls .tools button { flex: 0 0 auto; width: 72px; padding-left: 4px; padding-right: 4px; }
      }
      @media (max-width: 360px) {
        .view-controls { gap: 4px; }
        .view-controls .category-controls { gap: 3px; }
        .view-controls .tools { gap: 4px; }
        .view-controls .tools button { width: 60px; }
      }
    </style>
    <style>
      #list td:nth-child(6) { padding-left: 4px; padding-right: 4px; }
      #list input[type="date"] { width: 132px; max-width: 100%; min-width: 0; padding-left: 3px; padding-right: 3px; }
      @media (max-width: 760px) {
        #list tr { grid-template-columns: 45px 95px 140px 48px minmax(0, 1fr); }
        #list td:nth-child(1) { grid-column: 1; }
        #list td:nth-child(2) { grid-column: 2 / -1; }
        #list td:nth-child(3), #list td:nth-child(4) { grid-column: 1 / -1; }
        #list td:nth-child(5) { grid-column: 1 / 3; }
        #list td:nth-child(6) { grid-column: 3; }
        #list td:nth-child(7) { grid-column: 4; flex-wrap: nowrap; }
      }
    </style>
    <style>
      .status-select[value="Hold"] { background: #ffedd5; color: #9a3412; }
      @media (max-width: 760px) {
        .view-controls { display: flex; flex-wrap: wrap; }
        .view-controls .category-controls { flex: 0 0 auto; }
        .view-controls .tools { margin-left: auto; }
        .view-controls .tools button { width: auto; padding-left: 8px; padding-right: 8px; }
      }
    </style>
    <style>
      #list td.move-cell { padding: 3px; text-align: right; }
      #list .move-button { display: block; width: 28px; height: 26px; min-height: 0; margin-left: auto; padding: 3px; border: 0; background: transparent; color: #2563eb; }
      #list .move-button svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      #list .move-button:disabled { color: #cbd5e1; cursor: default; }
      #list .move-button:not(:disabled):hover { background: #dbeafe; }
      @media (max-width: 760px) {
        #list td.move-cell { grid-column: 5; flex-direction: column; align-items: flex-end; justify-content: center; gap: 0; border-bottom: 0; }
        #list td.move-cell::before { display: none; }
        #list td.actions-cell { flex-direction: row; justify-content: center; align-items: center; border-bottom: 0; }
      }
    </style>
</head>
<body>
  <main>
    <div class="top"><h1>工作待辦</h1><div class="view-controls"><div class="category-controls"><select id="categoryFilter" aria-label="篩選分類" onchange="categoryFilter = this.value; render()"><option value="">全部分類</option></select><select id="categorySort" aria-label="分類排序" onchange="categorySort = this.value; render()"><option value="">原始順序</option><option value="asc">分類升冪 ↑</option><option value="desc">分類降冪 ↓</option></select></div><div class="tools"><button id="todoBtn" class="primary" onclick="setView('todo')">進行中</button><button id="doneBtn" onclick="setView('done')">已完成</button><button id="holdBtn" onclick="setView('hold')">Hold</button></div></div></div>
    <div class="toolbar"><button id="addToggle" class="primary" onclick="toggleAddForm()">＋ 新增</button><span class="spacer"></span><button id="linkToggle" onclick="toggleLinks()">隱藏連結</button><button onclick="openSync('export')">匯出</button><button onclick="openSync('import')">匯入</button></div>
    <section id="addForm" class="form hidden"><input id="custom" placeholder="分類" aria-label="分類"><input id="work" placeholder="工作項目（必填）"><input id="note" placeholder="備註"><input id="taskLink" placeholder="連結或檔案路徑"><select id="status"><option>未開始</option><option>進行中</option><option>等待中</option><option>Hold</option><option>已完成</option></select><input id="date" type="date"><button class="primary" onclick="addTask()">新增</button></section>
    <div id="empty" class="empty hidden"></div><table id="table"><thead><tr><th id="categoryHeading" style="width:45px" aria-sort="none"><button id="categorySortButton" type="button" onclick="toggleCategorySort()" title="點擊切換分類排序">分類</button></th><th>工作項目</th><th style="width:23%">備註</th><th style="width:12%">連結</th><th style="width:140px">狀態</th><th style="width:140px">日期</th><th style="width:48px">操作</th><th style="width:36px" aria-label="調整順序"></th></tr></thead><tbody id="list"></tbody></table>
  </main>
  <div id="syncDialog" class="dialog-mask" onclick="if(event.target===this)closeSync()"><div class="dialog"><h2 id="syncTitle"></h2><p id="syncHelp"></p><label id="importMode" class="import-option hidden"><input id="merge" type="checkbox"> 保留目前資料</label><textarea id="syncText" spellcheck="false"></textarea><div class="actions"><button onclick="closeSync()">取消</button><button id="copyButton" class="primary" onclick="copyExport()">複製到剪貼簿</button><button id="importButton" class="primary hidden" onclick="importTasks()">確認匯入</button></div></div></div>
  <script>
    const storageKey = 'Engineering_Work_List', linkDisplayKey = 'Engineering_Work_List_show_links', statuses = ['未開始', '進行中', '等待中', 'Hold', '已完成']; let tasks = loadTasks(), currentView = 'todo', linksVisible = localStorage.getItem(linkDisplayKey) !== 'false';
    const $ = id => document.getElementById(id), today = () => new Date().toLocaleDateString('en-CA'), escapeHtml = value => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
    let categoryFilter = '', categorySort = '';
    function normalise(item) { return { custom: '', work: '', note: '', link: '', status: '未開始', date: '', color: '#ffffff', ...item, status: statuses.includes(item?.status) ? item.status : '未開始' }; }
    function loadTasks() { try { const value = JSON.parse(localStorage.getItem(storageKey) || '[]'); return Array.isArray(value) ? value.map(normalise) : []; } catch { return []; } } function save() { localStorage.setItem(storageKey, JSON.stringify(tasks)); }
    function addTask() { const task = normalise({ custom: $('custom').value.trim(), work: $('work').value.trim(), note: $('note').value.trim(), link: $('taskLink').value.trim(), status: $('status').value, date: $('date').value || today() }); if (!task.work) return alert('請輸入工作項目。'); tasks.push(task); save(); $('custom').value = $('work').value = $('note').value = $('taskLink').value = ''; $('date').value = today(); render(); }
    function editTask(index, field, value) { tasks[index][field] = value; save(); render(); } function resizeTaskField(field) { field.style.height = 'auto'; field.style.height = `${field.scrollHeight}px`; } function deleteTask(index) { if (confirm('確定要刪除這筆待辦嗎？')) { tasks.splice(index, 1); save(); render(); } } function setView(value) { currentView = value; categoryFilter = ''; render(); } function toggleLinks() { linksVisible = !linksVisible; localStorage.setItem(linkDisplayKey, linksVisible); render(); } function toggleAddForm() { const closed = $('addForm').classList.toggle('hidden'); $('addToggle').textContent = closed ? '＋ 新增' : '收合'; if (!closed) $('work').focus(); }
    function editLink(index) { const value = prompt('請輸入連結或檔案路徑：', tasks[index].link || ''); if (value !== null) editTask(index, 'link', value.trim()); } function copyLink(index) { const value = tasks[index].link || ''; if (!value) return alert('這筆待辦尚未設定連結。'); copyText(value, '連結已複製，可貼到 LINE 或瀏覽器。'); }
    async function copyText(value, message) { try { if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(value); else { const area = document.createElement('textarea'); area.value = value; document.body.append(area); area.select(); if (!document.execCommand('copy')) throw new Error('Copy failed'); area.remove(); } if (message) alert(message); return true; } catch { alert('複製失敗，請手動複製文字。'); return false; } } function statusOptions(value) { return statuses.map(s => `<option ${s === value ? 'selected' : ''}>${s}</option>`).join(''); }
    const categoryValue = task => String(task.custom ?? '').trim();
    const categoryCompare = (a, b) => a.localeCompare(b, 'zh-Hant', { numeric: true, sensitivity: 'base' });
    function updateCategoryControls() {
      const categories = [...new Set(tasks.map(normalise).filter(task => matchesView(task, currentView)).map(categoryValue))].sort(categoryCompare);
      if (categoryFilter && !categories.includes(categoryFilter.slice(2))) categoryFilter = '';
      $('categoryFilter').innerHTML = '<option value="">全部分類</option>' + categories.map(value => `<option value="${escapeHtml('c:' + value)}">${escapeHtml(value || '未分類')}</option>`).join('');
      $('categoryFilter').value = categoryFilter;
      $('categorySort').value = categorySort;
      $('categoryHeading').setAttribute('aria-sort', categorySort === 'asc' ? 'ascending' : categorySort === 'desc' ? 'descending' : 'none');
      $('categorySortButton').textContent = '分類' + (categorySort === 'asc' ? ' ↑' : categorySort === 'desc' ? ' ↓' : '');
    }
    function toggleCategorySort() {
      categorySort = categorySort === '' ? 'asc' : categorySort === 'asc' ? 'desc' : '';
      render();
    }
    function categoryRows(rows) {
      const filtered = rows.filter(({task}) => !categoryFilter || categoryValue(task) === categoryFilter.slice(2));
      if (categorySort) filtered.sort((a, b) => categoryCompare(categoryValue(a.task), categoryValue(b.task)) * (categorySort === 'asc' ? 1 : -1) || a.index - b.index);
      return filtered;
    }
    function matchesView(task, view) { return view === 'done' ? task.status === '已完成' : view === 'hold' ? task.status === 'Hold' : task.status !== '已完成' && task.status !== 'Hold'; }
    function render() { updateCategoryControls(); const rows = categoryRows(tasks.map((task, index) => ({ task: normalise(task), index })).filter(x => matchesView(x.task, currentView))); document.body.classList.toggle('links-hidden', !linksVisible); $('linkToggle').textContent = linksVisible ? '隱藏連結' : '顯示連結'; $('todoBtn').classList.toggle('primary', currentView === 'todo'); $('doneBtn').classList.toggle('primary', currentView === 'done'); $('holdBtn').classList.toggle('primary', currentView === 'hold'); $('empty').textContent = currentView === 'done' ? '尚無已完成的待辦。' : currentView === 'hold' ? '尚無 Hold 的待辦。' : '尚無進行中的待辦。'; $('empty').classList.toggle('hidden', rows.length > 0); $('table').classList.toggle('hidden', rows.length === 0); $('list').innerHTML = rows.map(({task, index}, position) => `<tr style="background:${escapeHtml(task.color)}"><td data-label="分類"><textarea rows="1" aria-label="分類" oninput="resizeTaskField(this)" onchange="editTask(${index}, 'custom', this.value)">${escapeHtml(task.custom)}</textarea></td><td data-label="工作"><textarea rows="1" oninput="resizeTaskField(this)" onchange="editTask(${index}, 'work', this.value)">${escapeHtml(task.work)}</textarea></td><td data-label="備註"><textarea rows="1" oninput="resizeTaskField(this)" onchange="editTask(${index}, 'note', this.value)">${escapeHtml(task.note)}</textarea></td><td data-label="連結">${task.link ? `<button class="link" onclick="copyLink(${index})">複製</button>　` : ''}<button class="link" onclick="editLink(${index})">編輯</button></td><td data-label="狀態"><select class="status-select" value="${escapeHtml(task.status)}" onchange="editTask(${index}, 'status', this.value)">${statusOptions(task.status)}</select></td><td data-label="日期"><input type="date" value="${escapeHtml(task.date)}" onchange="editTask(${index}, 'date', this.value)"></td><td class="actions-cell"><input class="color" type="color" value="${escapeHtml(task.color)}" title="列顏色" onchange="editTask(${index}, 'color', this.value)"><button class="danger" onclick="deleteTask(${index})">刪除</button></td><td class="move-cell"><button type="button" class="move-button" aria-label="上移" title="上移" onclick="moveTask(${index}, -1)" ${position === 0 ? 'disabled' : ''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" /></svg></button><button type="button" class="move-button" aria-label="下移" title="下移" onclick="moveTask(${index}, 1)" ${position === rows.length - 1 ? 'disabled' : ''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7" /></svg></button></td></tr>`).join(''); $('list').querySelectorAll('textarea').forEach(resizeTaskField); }
    function moveTask(index, direction) {
      if (direction !== -1 && direction !== 1) return;
      const rows = categoryRows(tasks.map((task, index) => ({ task: normalise(task), index })).filter(row => matchesView(row.task, currentView)));
      const position = rows.findIndex(row => row.index === index);
      const target = position + direction;
      if (position < 0 || target < 0 || target >= rows.length) return;
      const slots = rows.map(row => row.index).sort((a, b) => a - b);
      const ordered = rows.map(row => tasks[row.index]);
      [ordered[position], ordered[target]] = [ordered[target], ordered[position]];
      slots.forEach((slot, offset) => { tasks[slot] = ordered[offset]; });
      categorySort = '';
      save(); render();
    }
    function openSync(mode) { const exporting = mode === 'export'; $('syncTitle').textContent = exporting ? '匯出待辦資料' : '匯入待辦資料'; $('syncHelp').textContent = exporting ? '' : ''; $('syncText').value = exporting ? JSON.stringify({ app: '工作待辦', version: 1, exportedAt: new Date().toISOString(), tasks }, null, 2) : ''; $('syncText').readOnly = exporting; $('importMode').classList.toggle('hidden', exporting); $('copyButton').classList.toggle('hidden', !exporting); $('importButton').classList.toggle('hidden', exporting); $('syncDialog').classList.add('show'); $('syncText').focus(); if (exporting) $('syncText').select(); }
    function closeSync() { $('syncDialog').classList.remove('show'); } async function copyExport() { if (await copyText($('syncText').value)) closeSync(); }
    function importTasks() { let parsed; try { parsed = JSON.parse($('syncText').value.trim()); } catch { return alert('匯入文字格式不正確，請確認是從 LINE 複製完整的匯出內容。'); } const incoming = Array.isArray(parsed) ? parsed : parsed?.tasks; if (!Array.isArray(incoming) || !incoming.every(x => x && typeof x === 'object')) return alert('找不到待辦資料，請貼上本程式匯出的內容。'); const cleaned = incoming.map(normalise); if (!$('merge').checked && !confirm(`將以匯入的 ${cleaned.length} 筆資料取代目前 ${tasks.length} 筆資料，確定嗎？`)) return; tasks = $('merge').checked ? [...tasks, ...cleaned] : cleaned; save(); closeSync(); render(); }
    function enhanceActions() {
      const colors = [['#ffffff', ''], ['#dbeafe', ''], ['#dcfce7', ''], ['#fef3c7', ''], ['#fee2e2', '']];
      $('list').querySelectorAll('tr').forEach(row => {
        const input = row.querySelector('input[type="color"]');
        if (!input) return;
        row.style.setProperty('--task-color', input.value);
        const picker = document.createElement('div');
        picker.className = 'color-picker';
        const trigger = document.createElement('button');
        trigger.type = 'button';
        trigger.className = 'color task-color';
        trigger.title = '變更底色';
        trigger.style.backgroundColor = input.value;
        const palette = document.createElement('div');
        palette.className = 'color-palette';
        colors.forEach(([value]) => {
          const swatch = document.createElement('button');
          swatch.type = 'button'; swatch.className = 'color-swatch';
          swatch.style.backgroundColor = value;
          swatch.onclick = () => {
            row.style.setProperty('--task-color', value);
            editTask(Number(input.getAttribute('onchange').match(/editTask\((\d+)/)[1]), 'color', value);
          };
          palette.append(swatch);
        });
        trigger.onclick = () => {
          const isOpen = picker.classList.toggle('show');
          row.classList.toggle('palette-open', isOpen);
        };
        picker.append(trigger, palette);
        input.replaceWith(picker);
      });
    }
    const baseRender = render;
    render = function () { baseRender(); enhanceActions(); };
    $('date').value = today(); render();
  </script>
</body>
</html>
