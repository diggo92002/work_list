<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作待辦</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: #f5f6f8; color: #1f2937; font-family: "Microsoft JhengHei", system-ui, sans-serif; }
    main { max-width: 1200px; margin: auto; }
    .top, .tools, .toolbar, .form, .actions { display: flex; gap: 8px; align-items: center; }
    .top { margin-bottom: 12px; flex-wrap: wrap; } h1 { margin: 0 auto 0 0; font-size: 28px; }
    button, input, select, textarea { font: inherit; border: 1px solid #9ca3af; border-radius: 6px; background: #fff; }
    button, input, select { min-height: 38px; padding: 7px 10px; } button { cursor: pointer; }
    button.primary { color: #fff; background: #2563eb; border-color: #2563eb; } button.danger { color: #b91c1c; border-color: transparent; background: transparent; }
    .toolbar { padding: 10px 12px; margin-bottom: 12px; border-radius: 10px; background: #fff; box-shadow: 0 1px 2px #0000000d; }
    .toolbar .spacer { flex: 1; }.form { display: grid; grid-template-columns: 1.35fr 1.1fr 1.15fr 120px 145px auto; padding: 12px; margin-bottom: 12px; border-radius: 10px; background: #fff; box-shadow: 0 1px 2px #0000000d; }
    table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0 8px; background: transparent; } th, td { padding: 9px 10px; vertical-align: middle; } th { padding: 0 10px 5px; border: 0; color: #64748b; font-size: 13px; font-weight: 700; text-align: left; } #list tr { filter: drop-shadow(0 1px 1px #0000000d); } #list td { border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; background: #fff; } #list td:first-child { border-left: 1px solid #e2e8f0; border-radius: 9px 0 0 9px; } #list td:last-child { border-right: 1px solid #e2e8f0; border-radius: 0 9px 9px 0; } #list input:not([type="color"]) { border-color: transparent; background: transparent; } #list input:not([type="color"]):focus { border-color: #60a5fa; background: #fff; outline: 2px solid #dbeafe; } #list td:first-child input { font-weight: 700; color: #111827; } #list td:nth-child(2) input { color: #64748b; font-size: 14px; } td input, td select { width: 100%; }
    .link { color: #2563eb; text-decoration: none; border: 0; padding: 4px; min-height: auto; background: transparent; }.link:hover { text-decoration: underline; }.color { width: 30px; height: 30px; padding: 2px; }.actions-cell { white-space: nowrap; }.status-select { border: 0; border-radius: 99px; font-weight: 700; text-align: center; }.status-select[value="未開始"] { background: #e5e7eb; color: #374151; }.status-select[value="進行中"] { background: #dbeafe; color: #1d4ed8; }.status-select[value="等待中"] { background: #fef3c7; color: #92400e; }.status-select[value="已完成"] { background: #dcfce7; color: #15803d; }.empty { padding: 28px; text-align: center; background: #fff; border-radius: 8px; color: #6b7280; }.hidden { display: none !important; }
    #list textarea { display: block; width: 100%; min-height: 24px; padding: 0; overflow: hidden; resize: none; border-color: transparent; background: transparent; line-height: 1.45; font-family: inherit; font-size: inherit; } #list textarea:focus { border-color: #60a5fa; background: #fff; outline: 2px solid #dbeafe; } #list td:first-child textarea { font-weight: 700; color: #111827; } #list td:nth-child(2) textarea { color: #64748b; font-size: 14px; }
    body.links-hidden #taskLink, body.links-hidden #table th:nth-child(3), body.links-hidden #list td:nth-child(3) { display: none; }
    .dialog-mask { position: fixed; inset: 0; z-index: 10; display: none; padding: 18px; background: #0008; align-items: center; justify-content: center; }.dialog-mask.show { display: flex; }.dialog { width: min(680px, 100%); padding: 18px; border-radius: 10px; background: #fff; }.dialog h2 { margin: 0 0 8px; font-size: 20px; }.dialog p { margin: 0 0 12px; color: #4b5563; line-height: 1.5; }textarea { display: block; width: 100%; min-height: 240px; padding: 10px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }.dialog .actions { justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }.import-option { display: flex; gap: 6px; align-items: center; margin: 10px 0; }
    @media (max-width: 760px) { body { padding: 8px; }.tools, .toolbar { width: 100%; }.tools button, .toolbar button { flex: 1; }.toolbar { flex-wrap: wrap; }.toolbar .spacer { display: none; }.form { grid-template-columns: 1fr; }table, thead, tbody, tr, td { display: block; width: 100%; } thead { display: none; } tr { margin-bottom: 10px; border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; } td { display: grid; grid-template-columns: 72px 1fr; gap: 8px; border: 0; border-bottom: 1px solid #e5e7eb; } td:last-child { border-bottom: 0; } td::before { content: attr(data-label); color: #4b5563; font-weight: bold; } td.actions-cell { display: flex; justify-content: flex-end; } td.actions-cell::before { display: none; } }
  </style>
  <style>
    @media (max-width: 760px) {
      #list tr { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); margin-bottom: 8px; border: 1px solid #d1d5db; border-radius: 9px; overflow: hidden; background: #fff; }
      #list td, #list td:first-child, #list td:last-child { display: flex; flex-direction: column; align-items: stretch; gap: 3px; min-width: 0; padding: 6px 9px; border: 0; border-bottom: 1px solid #e5e7eb; border-radius: 0; }
      #list td::before { font-size: 12px; line-height: 1.2; }
      #list td:nth-child(1), #list td:nth-child(2) { grid-column: span 5; }
      #list td:nth-child(3) { grid-column: 1 / -1; }
      #list td:nth-child(4), #list td:nth-child(5) { grid-column: span 4; }
      #list td:nth-child(5), #list td:nth-child(6) { border-left: 1px solid #e5e7eb; }
      #list td:nth-child(6) { grid-column: span 2; }
      #list td:last-child { flex-direction: row; justify-content: flex-end; align-items: center; border-bottom: 0; min-height: 42px; }
      #list td:last-child::before { display: none; }
      #list td input:not([type="color"]), #list td select { min-height: 32px; padding: 4px 6px; }
      #list td:first-child input { font-size: 16px; }
      #list td:nth-child(2) input { font-size: 13px; }
      #list .links { min-height: 28px; }
      #list .actions-cell .color { width: 28px; height: 28px; }
    }
  </style>
    <style>
      /* 每列的底色覆蓋儲存格原本的白色背景，確保選色會立即顯示。 */
      #list tr td { background: var(--task-color, #fff) !important; }
      .actions-cell { display: flex; gap: 6px; white-space: nowrap; }
      .actions-cell .color, .actions-cell .danger { flex: 1 1 0; width: 0; min-width: 0; height: 32px; padding: 4px; }
      .actions-cell .danger { color: #b91c1c; border: 1px solid #fecaca; border-radius: 6px; background: #fef2f2; }
      .task-color { border-color: #9ca3af; }
      .color-picker { position: relative; flex: 1 1 0; min-width: 0; }
      .color-picker .color { width: 100%; }
      .color-palette { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 2; display: none; grid-template-columns: repeat(5, 28px); gap: 5px; padding: 6px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; box-shadow: 0 4px 12px #0002; }
      .color-picker.show .color-palette { display: grid; }
      #list tr.palette-open { overflow: visible; }
      .color-swatch { width: 28px; height: 28px; min-height: 0; padding: 0; border: 1px solid #94a3b8; border-radius: 5px; }
      @media (max-width: 760px) { .actions-cell .color, .actions-cell .danger { height: 30px; } }
    </style>
    <style>
      /* iOS 會在聚焦小於 16px 的欄位時自動放大頁面。 */
      @media (max-width: 760px) {
        #syncText { font-size: 16px; }
        .dialog-mask { padding: 10px; align-items: flex-start; overflow-y: auto; }
        .dialog { margin: 10px 0; }
      }
    </style>
</head>
<body>
  <main>
    <div class="top"><h1>工作待辦</h1><div class="tools"><button id="todoBtn" class="primary" onclick="setView('todo')">進行中</button><button id="doneBtn" onclick="setView('done')">已完成</button></div></div>
    <div class="toolbar"><button id="addToggle" class="primary" onclick="toggleAddForm()">＋ 新增</button><span class="spacer"></span><button id="linkToggle" onclick="toggleLinks()">隱藏連結</button><button onclick="openSync('export')">匯出</button><button onclick="openSync('import')">匯入</button></div>
    <section id="addForm" class="form hidden"><input id="work" placeholder="工作項目（必填）"><input id="note" placeholder="備註"><input id="taskLink" placeholder="連結或檔案路徑"><select id="status"><option>未開始</option><option>進行中</option><option>等待中</option><option>已完成</option></select><input id="date" type="date"><button class="primary" onclick="addTask()">新增</button></section>
    <div id="empty" class="empty hidden"></div><table id="table"><thead><tr><th style="width:30%">工作項目</th><th style="width:23%">備註</th><th style="width:12%">連結</th><th style="width:120px">狀態</th><th style="width:145px">日期</th><th style="width:105px">操作</th></tr></thead><tbody id="list"></tbody></table>
  </main>
  <div id="syncDialog" class="dialog-mask" onclick="if(event.target===this)closeSync()"><div class="dialog"><h2 id="syncTitle"></h2><p id="syncHelp"></p><label id="importMode" class="import-option hidden"><input id="merge" type="checkbox"> 保留目前資料，將匯入資料接在後面（不勾選會取代目前資料）</label><textarea id="syncText" spellcheck="false"></textarea><div class="actions"><button onclick="closeSync()">取消</button><button id="copyButton" class="primary" onclick="copyExport()">複製到剪貼簿</button><button id="importButton" class="primary hidden" onclick="importTasks()">確認匯入</button></div></div></div>
  <script>
    const storageKey = 'Engineering_Work_List', linkDisplayKey = 'Engineering_Work_List_show_links', statuses = ['未開始', '進行中', '等待中', '已完成']; let tasks = loadTasks(), currentView = 'todo', linksVisible = localStorage.getItem(linkDisplayKey) !== 'false';
    const $ = id => document.getElementById(id), today = () => new Date().toLocaleDateString('en-CA'), escapeHtml = value => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
    function normalise(item) { return { work: '', note: '', link: '', status: '未開始', date: '', color: '#ffffff', ...item, status: statuses.includes(item?.status) ? item.status : '未開始' }; }
    function loadTasks() { try { const value = JSON.parse(localStorage.getItem(storageKey) || '[]'); return Array.isArray(value) ? value.map(normalise) : []; } catch { return []; } } function save() { localStorage.setItem(storageKey, JSON.stringify(tasks)); }
    function addTask() { const task = normalise({ work: $('work').value.trim(), note: $('note').value.trim(), link: $('taskLink').value.trim(), status: $('status').value, date: $('date').value || today() }); if (!task.work) return alert('請輸入工作項目。'); tasks.push(task); save(); $('work').value = $('note').value = $('taskLink').value = ''; $('date').value = today(); render(); }
    function editTask(index, field, value) { tasks[index][field] = value; save(); render(); } function resizeTaskField(field) { field.style.height = 'auto'; field.style.height = `${field.scrollHeight}px`; } function deleteTask(index) { if (confirm('確定要刪除這筆待辦嗎？')) { tasks.splice(index, 1); save(); render(); } } function setView(value) { currentView = value; render(); } function toggleLinks() { linksVisible = !linksVisible; localStorage.setItem(linkDisplayKey, linksVisible); render(); } function toggleAddForm() { const closed = $('addForm').classList.toggle('hidden'); $('addToggle').textContent = closed ? '＋ 新增' : '收合'; if (!closed) $('work').focus(); }
    function editLink(index) { const value = prompt('請輸入連結或檔案路徑：', tasks[index].link || ''); if (value !== null) editTask(index, 'link', value.trim()); } function copyLink(index) { const value = tasks[index].link || ''; if (!value) return alert('這筆待辦尚未設定連結。'); copyText(value, '連結已複製，可貼到 LINE 或瀏覽器。'); }
    function copyText(value, message) { navigator.clipboard?.writeText(value).then(() => alert(message)).catch(() => { const area = document.createElement('textarea'); area.value = value; document.body.append(area); area.select(); document.execCommand('copy'); area.remove(); alert(message); }); } function statusOptions(value) { return statuses.map(s => `<option ${s === value ? 'selected' : ''}>${s}</option>`).join(''); }
    function render() { const rows = tasks.map((task, index) => ({ task: normalise(task), index })).filter(x => currentView === 'done' ? x.task.status === '已完成' : x.task.status !== '已完成'); document.body.classList.toggle('links-hidden', !linksVisible); $('linkToggle').textContent = linksVisible ? '隱藏連結' : '顯示連結'; $('todoBtn').classList.toggle('primary', currentView === 'todo'); $('doneBtn').classList.toggle('primary', currentView === 'done'); $('empty').textContent = currentView === 'done' ? '尚無已完成的待辦。' : '尚無進行中的待辦。'; $('empty').classList.toggle('hidden', rows.length > 0); $('table').classList.toggle('hidden', rows.length === 0); $('list').innerHTML = rows.map(({task, index}) => `<tr style="background:${escapeHtml(task.color)}"><td data-label="工作"><textarea rows="1" oninput="resizeTaskField(this)" onchange="editTask(${index}, 'work', this.value)">${escapeHtml(task.work)}</textarea></td><td data-label="備註"><textarea rows="1" oninput="resizeTaskField(this)" onchange="editTask(${index}, 'note', this.value)">${escapeHtml(task.note)}</textarea></td><td data-label="連結"><button class="link" onclick="copyLink(${index})">複製</button>　<button class="link" onclick="editLink(${index})">編輯</button></td><td data-label="狀態"><select class="status-select" value="${escapeHtml(task.status)}" onchange="editTask(${index}, 'status', this.value)">${statusOptions(task.status)}</select></td><td data-label="日期"><input type="date" value="${escapeHtml(task.date)}" onchange="editTask(${index}, 'date', this.value)"></td><td class="actions-cell"><input class="color" type="color" value="${escapeHtml(task.color)}" title="列顏色" onchange="editTask(${index}, 'color', this.value)"><button class="danger" onclick="deleteTask(${index})">刪除</button></td></tr>`).join(''); $('list').querySelectorAll('textarea').forEach(resizeTaskField); }
    function openSync(mode) { const exporting = mode === 'export'; $('syncTitle').textContent = exporting ? '匯出待辦資料' : '匯入待辦資料'; $('syncHelp').textContent = exporting ? '按「複製到剪貼簿」後，直接貼到 LINE 傳給自己；另一台裝置開啟本頁後，貼到匯入框即可。' : '請從 LINE 複製先前匯出的完整文字，貼在下方。'; $('syncText').value = exporting ? JSON.stringify({ app: '工作待辦', version: 1, exportedAt: new Date().toISOString(), tasks }, null, 2) : ''; $('syncText').readOnly = exporting; $('importMode').classList.toggle('hidden', exporting); $('copyButton').classList.toggle('hidden', !exporting); $('importButton').classList.toggle('hidden', exporting); $('syncDialog').classList.add('show'); $('syncText').focus(); if (exporting) $('syncText').select(); }
    function closeSync() { $('syncDialog').classList.remove('show'); } function copyExport() { copyText($('syncText').value, '待辦資料已複製，現在可貼到 LINE。'); }
    function importTasks() { let parsed; try { parsed = JSON.parse($('syncText').value.trim()); } catch { return alert('匯入文字格式不正確，請確認是從 LINE 複製完整的匯出內容。'); } const incoming = Array.isArray(parsed) ? parsed : parsed?.tasks; if (!Array.isArray(incoming) || !incoming.every(x => x && typeof x === 'object')) return alert('找不到待辦資料，請貼上本程式匯出的內容。'); const cleaned = incoming.map(normalise); if (!$('merge').checked && !confirm(`將以匯入的 ${cleaned.length} 筆資料取代目前 ${tasks.length} 筆資料，確定嗎？`)) return; tasks = $('merge').checked ? [...tasks, ...cleaned] : cleaned; save(); closeSync(); render(); alert(`已匯入 ${cleaned.length} 筆待辦資料。`); }
    function enhanceActions() {
      const colors = [['#ffffff', ''], ['#dbeafe', ''], ['#dcfce7', ''], ['#fef3c7', ''], ['#fee2e2', '']];
      $('list').querySelectorAll('tr').forEach(row => {
        const input = row.querySelector('input[type="color"]');
        if (!input) return;
        row.style.setProperty('--task-color', input.value);
        const picker = document.createElement('div');
        picker.className = 'color-picker';
        const trigger = document.createElement('button');
        trigger.type = 'button';
        trigger.className = 'color task-color';
        trigger.title = '變更底色';
        trigger.style.backgroundColor = input.value;
        const palette = document.createElement('div');
        palette.className = 'color-palette';
        colors.forEach(([value]) => {
          const swatch = document.createElement('button');
          swatch.type = 'button'; swatch.className = 'color-swatch';
          swatch.style.backgroundColor = value;
          swatch.onclick = () => {
            row.style.setProperty('--task-color', value);
            editTask(Number(input.getAttribute('onchange').match(/editTask\((\d+)/)[1]), 'color', value);
          };
          palette.append(swatch);
        });
        trigger.onclick = () => {
          const isOpen = picker.classList.toggle('show');
          row.classList.toggle('palette-open', isOpen);
        };
        picker.append(trigger, palette);
        input.replaceWith(picker);
      });
    }
    const baseRender = render;
    render = function () { baseRender(); enhanceActions(); };
    $('date').value = today(); render();
  </script>
</body>
</html>
