<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>工作代辦</title>
<style>
body{font-family:"Microsoft JhengHei";background:#f5f6f8;margin:20px}

.box{background:white;padding:15px;border-radius:10px;margin-bottom:15px}

table{width:100%;border-collapse:collapse;background:white;table-layout:fixed}
th,td{border:1px solid #ddd;padding:8px}

</style>
</head>
<body>

<h1>工作代辦</h1>

<div class="box">
<input id="work" placeholder="工作項目" style="width:220px">
<input id="note" placeholder="備註" style="width:220px">
<input id="link" placeholder="連結(資料夾/檔案/網址)" style="width:260px">
<select id="status">
<option>待處理</option>
<option>進行中</option>
<option>等待</option>
<option>完成</option>
</select>
<input id="date" type="date">
<button onclick="addTask()">新增</button>
</div>

<table>
<thead>
<tr>
<th style="width:40%">工作項目</th>
<th style="width:25%">備註</th>
<th style="width:20%">連結</th>
<th style="width:8%">狀態</th>
<th style="width:10%">建立日期</th>
<th style="width:7%">操作</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<script>
let tasks=JSON.parse(localStorage.getItem("Engineering_Work_List"))||[];

function save(){localStorage.setItem("Engineering_Work_List",JSON.stringify(tasks));}

function addTask(){
let t={
work:work.value,
note:note.value,
link:link.value,
status:status.value,
date:date.value
};
if(!t.work.trim()) return alert("請輸入工作項目");
tasks.push(t);
save();render();
work.value="";note.value="";link.value="";
}

function edit(i,k,v){
tasks[i][k]=v;
save();
}

function removeTask(i){
tasks.splice(i,1);
save();render();
}

// 判斷連結類型
function openLink(i){
let p=tasks[i].link.trim();

if(/^https?:\/\//i.test(p)){
    // 網路連結 -> 瀏覽器
    window.open(p,"_blank");
}else{
    // 本機資料夾或檔案 -> 檔案總管
    let path=p.replaceAll("\\","/");
    window.open("file:///"+path);
}
}

function esc(s){
return (s||"").replaceAll("&","&amp;").replaceAll('"',"&quot;")
.replaceAll("<","&lt;").replaceAll(">","&gt;");
}

function render(){
let h="";
tasks.forEach((t,i)=>{
h+=`
<tr>
<td><input class="cell" value="${esc(t.work)}" onchange="edit(${i},'work',this.value)"></td>
<td><input class="cell" value="${esc(t.note)}" onchange="edit(${i},'note',this.value)"></td>
<td>
<input class="cell" value="${esc(t.link)}" onchange="edit(${i},'link',this.value)">
${t.link?`<br><span class="linkBtn" onclick="openLink(${i})">開啟</span>`:""}
</td>
<td>
<select onchange="edit(${i},'status',this.value)">
<option ${t.status=="待處理"?"selected":""}>待處理</option>
<option ${t.status=="進行中"?"selected":""}>進行中</option>
<option ${t.status=="等待"?"selected":""}>等待</option>
<option ${t.status=="完成"?"selected":""}>完成</option>
</select>
</td>
<td><input type="date" value="${t.date||""}" onchange="edit(${i},'date',this.value)"></td>
<td><button onclick="removeTask(${i})">刪除</button></td>
</tr>`;
});
list.innerHTML=h;
}
document.head.insertAdjacentHTML('beforeend','<style>#table{font-size:150%}#table td:nth-child(1) input,#table td:nth-child(2) input{font-size:16px}#table td:nth-child(n+3){font-size:12px}#table td:nth-child(n+3) input,#table td:nth-child(n+3) select,#table td:nth-child(n+3) button{font-size:inherit}</style>');render();
</script>
</body>
</html>
